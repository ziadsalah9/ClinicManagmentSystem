spring.application.name=clinic-backend
# Load local .env values (e.g. GMAIL_APP_PASSWORD) when running from the project root.
# Docker deployments should provide the password as a real environment variable instead.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8083}
server.address=0.0.0.0
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=50
server.tomcat.accept-count=20

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/clinic_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


spring.jpa.open-in-view=false
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50
spring.task.scheduling.pool.size=1
#spring.profiles.active=local

security.jwt.secret-base64=${SECURITY_JWT_SECRET_BASE64}
# Swagger/OpenAPI (disabled by default in production; set env to true locally)
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.docExpansion=list
springdoc.show-actuator=false

# Doctor invitation email. Never commit SMTP credentials; provide them through environment variables.
# For reliable inbox delivery use a transactional provider with SPF, DKIM, and DMARC configured for the From domain.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:ziads5933@gmail.com}
spring.mail.password=${MAIL_PASSWORD:${GMAIL_APP_PASSWORD:}}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.from=${DOCTOR_INVITATION_FROM:${spring.mail.username}}
spring.mail.properties.mail.smtp.from=${DOCTOR_INVITATION_FROM:${spring.mail.username}}
app.doctor-invitation.from=${DOCTOR_INVITATION_FROM:${spring.mail.username}}
app.doctor-invitation.from-name=${DOCTOR_INVITATION_FROM_NAME:Clinic Management System}
app.doctor-invitation.reply-to=${DOCTOR_INVITATION_REPLY_TO:${app.doctor-invitation.from}}
app.doctor-invitation.claim-page-url=${DOCTOR_INVITATION_CLAIM_PAGE_URL:http://localhost:5173/doctor/claim}

# Central mobile request metadata. Header-bearing requests are always validated; required-path-patterns
# additionally makes listed paths require metadata even when the client sends no mobile header.
# Leave required-path-patterns empty when mobile and web clients share the same paths.
app.mobile-metadata.required-path-patterns=${MOBILE_METADATA_REQUIRED_PATH_PATTERNS:}
app.mobile-metadata.excluded-path-patterns=/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**,/actuator/**,/error
# Set only after the mobile team confirms the exact source-mobile-app contract values.
app.mobile-metadata.allowed-source-apps=${MOBILE_METADATA_ALLOWED_SOURCE_APPS:}
app.mobile-metadata.device-id-pattern=^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$

# Optional admin bootstrap (creates ROLE_ADMIN user on startup if phone not present)
identity.bootstrap.admin.phone=${IDENTITY_BOOTSTRAP_ADMIN_PHONE:}
identity.bootstrap.admin.password=${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:}
identity.bootstrap.admin.full-name=${IDENTITY_BOOTSTRAP_ADMIN_FULL_NAME:System Admin}
identity.bootstrap.admin.email=${IDENTITY_BOOTSTRAP_ADMIN_EMAIL:}


logging.level.org.springframework=INFO
logging.exception-conversion-word=%wex